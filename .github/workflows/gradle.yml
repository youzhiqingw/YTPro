name: Build Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;36.1.0 platform-tools'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > ytpro-release.jks

      - name: Generate keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=ytpro-release.jks\n' > keystore.properties
          printf 'storePassword=%s\n' "$STORE_PASSWORD" >> keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/release/app-release.apk --clobber
            gh release edit latest \
              --title "Latest Release" \
              --notes "Automated signed APK build from GitHub Actions"
          else
            gh release create latest app/build/outputs/apk/release/app-release.apk \
              --title "Latest Release" \
              --notes "Automated signed APK build from GitHub Actions"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YTPRO-release
          path: app/build/outputs/apk/release/app-release.apk
