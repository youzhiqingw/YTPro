name: Build Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;36.1.0 platform-tools'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > ytpro-release.jks

      - name: Generate keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=ytpro-release.jks\n' > keystore.properties
          printf 'storePassword=%s\n' "$STORE_PASSWORD" >> keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release
        run: |
          VERSION=$(grep versionName app/build.gradle | head -1 | sed 's/.*versionName "\(.*\)"/\1/')
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          TAG="v${VERSION}-${TIMESTAMP}"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --title "YTPro v${VERSION}" \
            --notes "YTPro 是一套基于 WebView 的第三方 YouTube 客户端，专为低版本 Android（5.0+）优化，支持后台播放、去广告、视频下载、手势控制等功能。非 Google 官方产品。

          **版本**: ${VERSION}
          **构建号**: ${TAG}
          **最低系统**: Android 5.0+
          **签名方案**: v1 + v2 + v3" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YTPRO-release
          path: app/build/outputs/apk/release/app-release.apk
